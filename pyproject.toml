[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrics"
version = "0.1.0"
description = "Simulation-based Quadruped Robot Intelligent Control System"
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "Lan Yinyin" }
]
dependencies = []

[project.optional-dependencies]
local-sim = [
  "mujoco>=3.2,<4",
]
dev = [
  "pytest",
  "ruff",
  "black",
  "mypy",
]
all = [
  "mujoco>=3.2,<4",
  "pytest",
  "ruff",
  "black",
  "mypy",
]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"qrics.sim.assets.quadrupeds" = ["*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["python"]

[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*"]
ignore_missing_imports = true